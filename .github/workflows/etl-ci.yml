name: ETL Pipeline CI

on:
  push:
    paths: 
      - 'etl/**'
      - '.github/workflows/etl-ci.yml'
  pull_request: 
    paths: 
      - 'etl/**'
      - '.github/workflows/etl-ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enem_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          cache: 'pip'
      
      - name: Instalar dependências do ETL e Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
          pip install pytest pytest-cov pyarrow
      
      - name: Rodar Testes Automatizados
        env: 
          PYTHONPATH: .
        run: |
          pytest etl/tests/ -v -s
      
      - name: Testar a construção da Imagem Docker
        working-directory: ./etl
        run: |
          docker build -t enem-metrics-etl:ci-test .
    