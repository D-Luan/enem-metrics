name: ETL Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
    paths: 
      - 'etl/**'
  pull_request: 
    branches: [ "main", "master" ]
    paths: 
      - 'etl/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with: 
          python-version: "3.12"
          cache: 'pip'
      
      - name: Instalar dependências do ETL e Pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt
          pip install pytest pytest-cov
      
      - name: Rodar Testes Unitários de Qualidade de Dados
        env: 
          PYTHONPATH: .
        run: |
          pytest etl/tests/
      
      - name: Testar a construção da Imagem Docker
        working-directory: ./etl
        run: |
          docker build -t enem-metrics-etl:ci-test .
    