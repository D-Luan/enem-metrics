version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: postgres_enem_metrics
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql_scripts:/docker-entrypoint-initdb.d
    networks:
      - enem_metrics_network

  etl:
    image: enem-metrics-etl
    container_name: etl_enem_metrics
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_PORT: 5432
      DB_HOST: ${DB_HOST}
    volumes:
      - ./etl/data:/app/data
    networks:
      - enem_metrics_network
    #depends_on:
      #- database

volumes:
  postgres_data:

networks:
  enem_metrics_network: