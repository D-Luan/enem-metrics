version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: postgres_enem_metrics
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql_scripts:/docker-entrypoint-initdb.d
    networks:
      - enem_metrics_network

volumes:
  postgres_data:

networks:
  enem_metrics_network: